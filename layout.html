<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout ฝ่ายผลิต | Daily Quality Inspection</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#16324f;--gold:#c9a24a;--ok:#16a34a;--ng:#dc2626;--part:#f59e0b;--fix:#0891b2;--none:#cbd5e1;--text:#1f2937;--muted:#6b7280;--bg:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#0f2137,var(--navy));color:#fff;padding:12px 18px;border-bottom:3px solid var(--gold);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px}header small{color:#cbd5e1;display:block;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #d1d5db;background:#fff}
button{cursor:pointer;font-weight:600}button.pri{background:var(--gold);border-color:var(--gold);color:#1f2937}
button.dng{color:var(--ng)}a.back{color:#fff;font-size:13px;text-decoration:none;opacity:.85}
main{padding:14px 18px;max-width:1500px;margin:0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.chip{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:4px 12px;font-weight:600}
.edit-bar{background:#fff;border:1px dashed var(--gold);border-radius:10px;padding:10px;margin-bottom:10px}
#stage{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;touch-action:none;user-select:none}
#stage img{display:block;width:100%;height:auto}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.mk{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--none);border-radius:10px;padding:3px 6px;box-shadow:0 2px 6px rgba(0,0,0,.25);text-align:center;min-width:64px;max-width:120px;cursor:pointer}
.mk.ok{border-color:var(--ok)}.mk.ng{border-color:var(--ng);animation:pulse 1.2s infinite}.mk.part{border-color:var(--part)}
.mk.sel{outline:3px solid var(--navy)}.edit .mk{cursor:grab}
.mk .n{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .st{display:flex;gap:3px;justify-content:center;margin-top:2px}
.mk i{font-style:normal;font-size:10px;font-weight:700;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--none);color:#fff}
i.ok{background:var(--ok)}i.ng{background:var(--ng)}i.partial{background:var(--part)}i.fixed{background:var(--fix)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(220,38,38,.25)}}
#info{margin-top:10px;font-size:13px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px;min-height:20px}
.legend{font-size:12px;color:var(--muted);margin:8px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin:0 3px 0 10px}
.warn{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
</style>
</head>
<body>
<header>
  <div><a class="back" href="index.html">‹ กลับแอปหลัก</a><h1 id="ttl">Layout ฝ่ายผลิต</h1><small>สถานะการตรวจ S / M / E ตามตำแหน่งจริงบน Layout</small></div>
  <div class="bar">
    <input type="date" id="date">
    <button id="btn-refresh" type="button">🔄 รีเฟรช</button>
    <button id="btn-edit" type="button">✏️ แก้ไข Layout (Admin)</button>
  </div>
</header>
<main>
  <div id="warn"></div>
  <div class="chips" id="chips"></div>
  <div class="edit-bar" id="editbar" style="display:none">
    <div class="bar">
      <input id="e-title" placeholder="ชื่อ Layout" style="width:200px">
      <label class="chip" style="cursor:pointer">🖼️ อัปโหลดรูป Layout<input type="file" id="e-img" accept="image/*" hidden></label>
      <select id="e-part"></select>
      <button id="e-add" type="button">➕ เพิ่มจุด</button>
      <button id="e-del" type="button" class="dng">🗑️ ลบจุดที่เลือก</button>
      <button id="e-save" type="button" class="pri">💾 บันทึก</button>
      <button id="e-exit" type="button">ออกจากโหมดแก้ไข</button>
    </div>
    <div class="legend">ลากจุดไปวางบน Layout ตามตำแหน่งจริง · กดจุดเพื่อเลือก/ลบ · อย่าลืมกด "บันทึก"</div>
  </div>
  <div id="stage"></div>
  <div class="legend">สัญลักษณ์ S M E:<i style="background:var(--none)"></i>ยังไม่ตรวจ<i style="background:var(--ok)"></i>ผ่าน<i style="background:var(--ng)"></i>NG<i style="background:var(--part)"></i>ตรวจยังไม่ครบ<i style="background:var(--fix)"></i>แก้ไขแล้ว</div>
  <div id="info">กดที่จุดบน Layout เพื่อดูรายละเอียด</div>
</main>
<script>
const SB_URL='https://knzzmurumqrhwotyrooj.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuenptdXJ1bXFyaHdvdHlyb29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTYzMzIsImV4cCI6MjEwNjI5MjMzMn0.-lGoef8S7TZ-IDpPyEVzNjWpVcPVjWk3x4pJ3iYk5IU';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGES=['S','M','E'];
let cfg={title:'Layout ฝ่ายผลิต',image:'',markers:[]}, parts={}, status={}, edit=false, creds=null, sel=null, tableOk=true;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

async function loadMaster(){
  let [j,l,d]=await Promise.all([sb.from('jigs').select('id,name,line_id'),sb.from('lines').select('id,name,dept_id'),sb.from('departments').select('id,name,section')]);
  if(d.error) d=await sb.from('departments').select('id,name');
  const dep={},ln={};(d.data||[]).forEach(x=>dep[x.id]=x);(l.data||[]).forEach(x=>ln[x.id]=x);
  parts={};(j.data||[]).forEach(p=>{const m=ln[p.line_id],q=m&&dep[m.dept_id];parts[p.id]={name:p.name,model:m?m.name:'',line:q?q.name:'',section:q&&q.section||''}});
  const c=await sb.from('layout_config').select('data').eq('id','main').maybeSingle();
  if(c.error){tableOk=false}else if(c.data&&c.data.data){cfg=Object.assign(cfg,c.data.data);cfg.markers=cfg.markers||[]}
}
function stageStates(rec){
  const items=rec.items||[];
  return STAGES.map((_,p)=>{
    const st=items.map(i=>(i.pieces&&i.pieces[p]&&i.pieces[p].status)||'');
    const done=st.filter(Boolean).length;
    if(!items.length||!done) return 'none';
    if(st.includes('ng')) return 'ng';
    if(done<items.length) return 'partial';
    return st.includes('fixed')?'fixed':'ok';
  });
}
async function loadStatus(){
  status={};
  const {data,error}=await sb.from('history').select('id,jig_id,ts,items').eq('insp_date',$('date').value).order('ts',{ascending:true});
  if(error){$('warn').innerHTML='<div class="warn">อ่านข้อมูลการตรวจไม่สำเร็จ: '+esc(error.message)+'</div>';return}
  (data||[]).forEach(r=>{status[r.jig_id]=stageStates(r)}); // เรียงเก่า→ใหม่ ตัวสุดท้ายของ Part เดียวกันจะทับ = ชุดล่าสุดของวัน
}
const overall=s=>!s||s.every(x=>x==='none')?'none':s.includes('ng')?'ng':s.every(x=>x==='ok'||x==='fixed')?'ok':'part';
function render(){
  $('ttl').textContent=cfg.title||'Layout ฝ่ายผลิต';
  $('warn').innerHTML=tableOk?'':'<div class="warn">ยังไม่ได้สร้างตาราง layout_config ใน Supabase — ให้รันไฟล์ layout_config.sql ก่อน</div>';
  const st=$('stage');st.className=edit?'edit':'';
  if(!cfg.image){st.innerHTML='<div class="empty">ยังไม่มีรูป Layout — กด "แก้ไข Layout (Admin)" เพื่ออัปโหลดรูปและวางจุด</div>'}
  else{st.innerHTML='<img src="'+cfg.image+'" draggable="false">'+cfg.markers.map(m=>{
    const p=parts[m.jigId]||{name:m.jigId},s=status[m.jigId]||['none','none','none'],o=overall(s);
    return '<div class="mk '+o+(sel===m.id?' sel':'')+'" data-id="'+m.id+'" style="left:'+m.x+'%;top:'+m.y+'%"><div class="n">'+esc(p.name)+'</div><div class="st">'+STAGES.map((l,i)=>'<i class="'+s[i]+'">'+l+'</i>').join('')+'</div></div>'}).join('')}
  const c={ok:0,part:0,ng:0,none:0};cfg.markers.forEach(m=>c[overall(status[m.jigId])]++);
  $('chips').innerHTML='<span class="chip">✅ ครบ '+c.ok+'</span><span class="chip">🟡 กำลังตรวจ '+c.part+'</span><span class="chip">🔴 NG '+c.ng+'</span><span class="chip">⚪ ยังไม่ตรวจ '+c.none+'</span>';
  const used=new Set(cfg.markers.map(m=>m.jigId)),by={};
  Object.entries(parts).filter(([id])=>!used.has(id)).forEach(([id,p])=>{(by[p.line+' / '+p.model]=by[p.line+' / '+p.model]||[]).push([id,p.name])});
  $('e-part').innerHTML='<option value="">เลือก Part ที่จะวาง...</option>'+Object.entries(by).map(([g,a])=>'<optgroup label="'+esc(g)+'">'+a.map(([id,n])=>'<option value="'+esc(id)+'">'+esc(n)+'</option>').join('')+'</optgroup>').join('');
}
function showInfo(id){
  const m=cfg.markers.find(x=>x.id===id);if(!m)return;
  const p=parts[m.jigId]||{name:m.jigId,line:'',model:'',section:''},s=status[m.jigId]||['none','none','none'];
  const T={none:'ยังไม่ตรวจ',ok:'ผ่าน',ng:'NG',partial:'ตรวจยังไม่ครบ',fixed:'แก้ไขแล้ว'};
  $('info').innerHTML='<b>'+esc(p.name)+'</b> <span style="color:#6b7280">('+esc(m.jigId)+')</span><br>แผนก: '+esc(p.section||'-')+' · Line: '+esc(p.line||'-')+' · Model: '+esc(p.model||'-')+'<br>'+STAGES.map((l,i)=>'<b>'+l+'</b>: '+T[s[i]]).join(' &nbsp;|&nbsp; ');
}
// ── คลิก/ลากจุด ──
$('stage').addEventListener('pointerdown',e=>{
  const el=e.target.closest('.mk');if(!el)return;
  sel=el.dataset.id;showInfo(sel);
  document.querySelectorAll('.mk').forEach(x=>x.classList.toggle('sel',x===el));
  if(!edit)return;
  const m=cfg.markers.find(x=>x.id===sel),r=$('stage').getBoundingClientRect();
  el.setPointerCapture(e.pointerId);
  const mv=ev=>{m.x=+Math.min(100,Math.max(0,(ev.clientX-r.left)/r.width*100)).toFixed(2);m.y=+Math.min(100,Math.max(0,(ev.clientY-r.top)/r.height*100)).toFixed(2);el.style.left=m.x+'%';el.style.top=m.y+'%'};
  const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up)};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
});
// ── โหมดแก้ไข (ต้องล็อกอิน Admin) ──
async function enterEdit(){
  if(!creds){
    const u=prompt('ชื่อผู้ใช้ Admin:'),p=u&&prompt('รหัสผ่าน Admin:');if(!p)return;
    const {data:ok,error}=await sb.rpc('verify_admin_login',{p_username:u,p_password:p});
    if(error||!ok){alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');return}
    creds={u,p};
  }
  edit=true;$('editbar').style.display='';$('e-title').value=cfg.title||'';render();
}
$('btn-edit').onclick=enterEdit;
$('e-exit').onclick=()=>{edit=false;$('editbar').style.display='none';render()};
$('e-title').oninput=e=>{cfg.title=e.target.value;$('ttl').textContent=cfg.title};
$('e-add').onclick=()=>{
  const id=$('e-part').value;if(!id){alert('เลือก Part ก่อนค่ะ');return}
  if(!cfg.image){alert('อัปโหลดรูป Layout ก่อนค่ะ');return}
  const m={id:'m'+Date.now(),jigId:id,x:50,y:50};cfg.markers.push(m);sel=m.id;render();showInfo(sel);
};
$('e-del').onclick=()=>{if(!sel)return;cfg.markers=cfg.markers.filter(m=>m.id!==sel);sel=null;render()};
$('e-img').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{const k=Math.min(1,1600/img.width),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cfg.image=c.toDataURL('image/jpeg',.82);render()};
  img.src=URL.createObjectURL(f);e.target.value='';
};
$('e-save').onclick=async()=>{
  const {data:ok,error}=await sb.rpc('save_layout_config',{p_username:creds.u,p_password:creds.p,p_data:cfg});
  if(error){alert('บันทึกไม่สำเร็จ: '+error.message+(/could not find|does not exist/i.test(error.message)?'\n\nให้รันไฟล์ layout_config.sql ใน Supabase ก่อน':''));return}
  if(!ok){creds=null;alert('รหัสผ่าน Admin ไม่ถูกต้อง');return}
  alert('บันทึก Layout เรียบร้อย ✅');
};
async function refresh(){await loadStatus();render()}
$('date').value=today();$('date').onchange=refresh;$('btn-refresh').onclick=refresh;
setInterval(()=>{if(!edit)refresh()},60000); // รีเฟรชอัตโนมัติทุก 1 นาที (เหมาะกับจอ TV)
(async()=>{await loadMaster();await loadStatus();render();if(new URLSearchParams(location.search).get('edit')==='1')enterEdit()})();
</script>
</body>
</html>
