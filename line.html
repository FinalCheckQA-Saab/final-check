*{box-sizing:border-box}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;min-height:100vh;font-family:'Noto Sans Thai',Tahoma,sans-serif;background:radial-gradient(1000px 360px at 50% -120px,var(--accent-dim),transparent 72%) no-repeat,var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand-gold);outline-offset:2px}
header{background:radial-gradient(520px 150px at 88% -35%,color-mix(in srgb,var(--accent) 60%,transparent),transparent 70%),linear-gradient(120deg,var(--brand-navy-900),var(--brand-navy-700));color:#fff;padding:14px 24px 16px;border-bottom:3px solid var(--brand-gold);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;box-shadow:0 10px 30px -14px rgba(0,0,0,.55)}
header h1{margin:4px 0 2px;font-size:26px;font-weight:700;letter-spacing:.2px;line-height:1.2}
header small{color:rgba(255,255,255,.72);display:block;font-size:13px}
.bar a.back{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);color:#fff;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.bar a.back svg{flex:none;transition:transform .25s}
.bar a.back:hover{background:var(--ng);border-color:var(--ng)}.bar a.back:hover svg{transform:rotate(90deg)}
header.hd-min .bar a.back{padding:5px 12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar button{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.bar button:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.6)}
.bar button svg{color:var(--brand-gold);flex:none;transition:transform .35s}
.bar button:hover svg{transform:rotate(90deg)}
.bar button.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar #btn-hd,.bar #btn-mode{padding:8px 10px}.bar #btn-hd svg{transition:transform .25s}.bar #btn-hd:hover svg{transform:none}
header.hd-min{padding:8px 24px;position:sticky;top:0;z-index:20}
header.hd-min>div:first-child{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.hd-min h1{font-size:18px;margin:0}header.hd-min small{font-size:13px;margin:0;padding-left:14px;border-left:1px solid rgba(255,255,255,.25)}
header.hd-min .bar{gap:8px}header.hd-min .bar button{padding:5px 12px}header.hd-min .bar #btn-hd,header.hd-min .bar #btn-mode{padding:5px 9px}
header.hd-min #btn-hd svg{transform:rotate(180deg)}
.live{font-size:12px;color:#bbf7d0;display:inline-flex;align-items:center;gap:7px;margin-right:4px}.live[hidden]{display:none}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%,100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
main{padding:20px 24px 56px;max-width:1080px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
h2{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--accent),var(--brand-gold));flex:none}
/* ตัวกรอง */
.filt{padding:14px 18px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.frow+.frow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.filt label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.filt input,.filt select,.filt button{font:inherit;font-size:14px;height:40px;padding:0 11px;border-radius:10px;border:1px solid var(--inp-bd);background:var(--inp);color:var(--text);transition:border-color .15s,box-shadow .15s,transform .15s,filter .15s}
.filt select{min-width:140px;max-width:230px}.filt input[type=search]{min-width:230px}
.filt input:focus,.filt select:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-dim)}
.filt button{font-weight:600;cursor:pointer;padding:0 18px}
#btn-today{background:linear-gradient(135deg,var(--accent),var(--brand-navy-700));border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px var(--accent)}#btn-today:hover{filter:brightness(1.12);transform:translateY(-1px)}
#btn-reset{color:var(--muted)}#btn-reset:hover{background:var(--soft)}
/* สรุปรวม */
.hero-top{display:flex;align-items:center;gap:22px;margin-bottom:18px;flex-wrap:wrap}
.hero-info{flex:1;min-width:230px}.hero-info h2{margin-bottom:10px}
.ring{--c:var(--accent);position:relative;width:104px;height:104px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-content:center;text-align:center}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.ring>*{position:relative}
.ring b{font-family:var(--num);font-size:30px;font-weight:700;line-height:1;color:var(--ink)}.ring b small{font-size:15px;font-weight:600;margin-left:1px}
.ring span{font-size:11px;color:var(--muted);margin-top:3px}
.ring.ok{--c:var(--ok)}.ring.ng{--c:var(--ng)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kp{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 6px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--muted)}
.kp b{min-width:26px;height:26px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font-family:var(--num);font-size:13px;color:#fff;background:var(--none)}
.kp.ok b{background:var(--ok)}.kp.partial b{background:var(--part)}.kp.ng b{background:var(--ng)}
.kp.ok{color:var(--ok-t)}.kp.partial{color:var(--part-t)}.kp.ng{color:var(--ng-t)}.kp.z{opacity:.45}
/* S / M / E */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sbox{position:relative;overflow:hidden;border-radius:16px;padding:16px 18px;color:#fff;background:var(--none);display:grid;grid-template-columns:auto 1fr;grid-template-areas:"b st" "sg sg";gap:12px 16px;align-items:center;transition:transform .18s,box-shadow .18s}
.sbox:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(0,0,0,.4)}
.sbox::before{content:"";position:absolute;right:-34px;top:-44px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
.sbox::after{position:absolute;right:16px;top:10px;font-size:20px;font-weight:700;opacity:.92}
.sbox.ok::after{content:"✓"}.sbox.partial::after{content:"◐"}.sbox.ng::after{content:"!"}
.sbox b{grid-area:b;width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--num);font-size:36px;font-weight:700;line-height:1}
.sbox .st{grid-area:st;min-width:0}
.sbox .st span{display:block;font-size:18px;font-weight:700;line-height:1.25}
.sbox .st em{display:block;font-style:normal;font-size:13px;opacity:.92;margin-top:2px;font-variant-numeric:tabular-nums}
.seg{grid-area:sg;display:flex;gap:5px;height:9px}.seg i{flex:1;border-radius:5px;background:rgba(255,255,255,.22)}
.seg i.ok{background:#fff}.seg i.partial{background:rgba(255,255,255,.55)}.seg i.ng{background:rgba(15,23,42,.6)}
.sbox.ok{background:linear-gradient(135deg,#15803d,#22c55e)}
.sbox.partial{background:linear-gradient(135deg,#c2680a,#f59e0b)}
.sbox.ng{background:linear-gradient(135deg,#b91c1c,#ef4444);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}70%,100%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
.sbox.none{background:var(--soft);border:1.5px dashed var(--inp-bd);color:var(--muted)}.sbox.none::before{display:none}.sbox.none b{background:var(--card)}.sbox.none .seg i{background:var(--line)}
.sbox.off{display:flex;gap:14px;background:var(--soft);color:var(--muted)}.sbox.off::before,.sbox.off::after{display:none}.sbox.off b{width:auto;height:auto;background:none;font-size:30px}.sbox.off span{font-size:16px;font-weight:600}
.sum .sbox.off{grid-column:1/-1}
/* หัวข้อวัน / Line / Model */
.dayh{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;color:var(--ink);margin:26px 2px 12px}
.dayh::after{content:"";flex:1;height:1px;background:var(--line)}
.lnh{font-size:14px;font-weight:700;color:var(--ink);border-left:4px solid var(--brand-gold);background:var(--soft);padding:8px 12px;margin:18px 0 4px;border-radius:0 10px 10px 0}.lnh small{color:var(--muted);font-weight:400}
.model{display:flex;width:fit-content;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-dim);padding:4px 13px;border-radius:999px;margin:18px 0 0}
/* แถว Part */
.row{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px 12px 18px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px;transition:transform .15s,box-shadow .15s,border-color .15s}
.row:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.row::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:5px;border-radius:12px 0 0 12px;background:var(--none)}
.row.s-ok::before{background:var(--ok)}.row.s-ng::before{background:var(--ng)}.row.s-partial::before{background:var(--part)}
.row.s-ng{background:color-mix(in srgb,var(--ng) 8%,var(--card));border-color:color-mix(in srgb,var(--ng) 35%,var(--line))}

<script>
const SB_URL='https://knzzmurumqrhwotyrooj.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuenptdXJ1bXFyaHdvdHlyb29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTYzMzIsImV4cCI6MjEwNjI5MjMzMn0.-lGoef8S7TZ-IDpPyEVzNjWpVcPVjWk3x4pJ3iYk5IU';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGES=['S','M','E'];

let parts=[], deptList=[], deptMap=Object.create(null), status={}, skipsBy={}, errs=[], mErrs=[], rangeBad=false, loadTk=0;
const MAXD=62; // เลือกช่วงวันที่ได้ไม่เกิน 62 วัน

// ดึงข้อมูลทีละ 1,000 แถว (Supabase จำกัดแถวต่อครั้ง) — ต้อง order ให้คงที่ทุกครั้งที่เรียก
async function fetchAll(mk){const out=[];for(let a=0;;a+=1000){const {data,error}=await mk().range(a,a+999);if(error)return{data:out,error};out.push(...(data||[]));if(!data||data.length<1000)break}return{data:out,error:null}}
const addDay=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const spanDays=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5)+1;
async function loadMaster(){
  const [d,l,j]=await Promise.all([sb.from('departments').select('id,name,section'),fetchAll(()=>sb.from('lines').select('id,name,dept_id').order('id')),fetchAll(()=>sb.from('jigs').select('id,name,line_id').order('id'))]);
  let dep=d;if(dep.error)dep=await sb.from('departments').select('id,name');
  if(dep.error)mErrs.push('อ่านรายการ Line ไม่สำเร็จ: '+dep.error.message);
  if(l.error)mErrs.push('อ่านรายการ Model ไม่สำเร็จ: '+l.error.message);
  if(j.error)mErrs.push('อ่านรายการ Part ไม่สำเร็จ: '+j.error.message);
  deptList=(dep.data||[]).map(x=>({id:String(x.id),name:x.name,section:x.section||''}));
  deptList.forEach(x=>deptMap[x.id]=x);
  const ln={};(l.data||[]).forEach(x=>ln[x.id]={name:x.name,dept:String(x.dept_id)});
  parts=(j.data||[]).filter(p=>ln[p.line_id]!==undefined&&deptMap[ln[p.line_id].dept]).map(p=>({id:p.id,name:p.name,model:ln[p.line_id].name,dept:ln[p.line_id].dept}));
  if(LINE&&!deptMap[LINE])mErrs.push('ไม่พบ Line ตามลิงก์ที่เปิดมา — แสดงทุก Line แทน');
}
// ===== ตัวกรอง (แผนก → Line → Model ผูกกัน) =====
function fillSel(id,opts,all){const el=$(id),cur=el.value;el.innerHTML='<option value="">'+all+'</option>'+opts.map(o=>'<option value="'+esc(o.v)+'">'+esc(o.t)+'</option>').join('');el.value=opts.some(o=>o.v===cur)?cur:''}
function refreshOpts(){
  const sec=$('f-sec').value;
  fillSel('f-dept',deptList.filter(x=>!sec||x.section===sec).map(x=>({v:x.id,t:x.name})),'ทุก Line');
  const d=$('f-dept').value;
  const ms=[...new Set(parts.filter(p=>(!d||p.dept===d)&&(!sec||deptMap[p.dept].section===sec)).map(p=>p.model))].sort();
  fillSel('f-model',ms.map(m=>({v:m,t:m})),'ทุก Model');
}
function applyInitFilters(){ // ค่าเริ่มต้น = Line ที่เปิดมาจากหน้า Layout (ถ้าไม่มี = ทั้งหมด)
  const ok=!!deptMap[LINE];
  $('f-sec').value=ok?deptMap[LINE].section:'';refreshOpts();
  $('f-dept').value=ok?LINE:'';refreshOpts();
  $('f-model').value='';$('f-part').value='';
}
function initFilters(){
  const secs=[...new Set(deptList.map(x=>x.section).filter(Boolean))].sort();
  fillSel('f-sec',secs.map(s=>({v:s,t:s})),'ทุกแผนก');
  applyInitFilters();
}
function filtered(){
  const s=$('f-sec').value,d=$('f-dept').value,m=$('f-model').value,k=$('f-part').value.trim().toLowerCase();
  return parts.filter(p=>(!d||p.dept===d)&&(!s||deptMap[p.dept].section===s)&&(!m||p.model===m)&&(!k||String(p.id).toLowerCase().includes(k)||String(p.name).toLowerCase().includes(k)));
}

// สถานะของ 1 Part ต่อช่วง S/M/E (ตรรกะเดียวกับหน้า Layout)
function stageStates(rec){
  const items=rec.items||[];
  return STAGES.map((_,p)=>{
    const st=items.map(i=>(i.pieces&&i.pieces[p]&&i.pieces[p].status)||'');
    const done=st.filter(Boolean).length;
    if(!items.length||!done)return 'none';
    if(st.includes('ng'))return 'ng';
    if(done<items.length)return 'partial';
    return 'ok'; // ชิ้นที่แก้ไขแล้วนับเป็น "ผ่าน"
  });
}
function aggStage(v){
  if(v.includes('ng'))return 'ng';
  if(!v.length||v.every(x=>x==='none'))return 'none';
  if(v.every(x=>x==='ok'))return 'ok';
  return 'partial';
}
async function loadStatus(){
  const tk=++loadTk,st={},skp={},er=[];let bad=false;
  const from=$('f-from').value,to=$('f-to').value;
  if(!from||!to||spanDays(from,to)>MAXD){
    bad=true;if(from&&to)er.push('เลือกช่วงวันที่ได้ไม่เกิน '+MAXD+' วัน กรุณาเลือกช่วงที่สั้นลง');
  }else{
    const [sk,hs]=await Promise.all([
      fetchAll(()=>sb.from('jig_skips').select('jig_id,skip_date').gte('skip_date',from).lte('skip_date',to).order('skip_date').order('jig_id')),
      fetchAll(()=>sb.from('history').select('id,jig_id,ts,items,production_order,inspector,insp_date').gte('insp_date',from).lte('insp_date',to).order('ts',{ascending:true}).order('id',{ascending:true}))
    ]);
    if(sk.error)er.push('อ่านรายการ Part ที่ไม่ผลิตไม่สำเร็จ ('+sk.error.message+') — ตัวเลขอาจรวม Part ที่ไม่ได้ผลิต');
    (sk.data||[]).forEach(r=>{const d=String(r.skip_date).slice(0,10);(skp[d]=skp[d]||new Set()).add(r.jig_id)});
    if(hs.error)er.push('อ่านข้อมูลการตรวจไม่สำเร็จ: '+hs.error.message);
    // ตัวสุดท้ายของ Part ในแต่ละวันทับ = ชุดล่าสุดของวันนั้น
    (hs.data||[]).forEach(r=>{const d=String(r.insp_date).slice(0,10);(st[d]=st[d]||{})[r.jig_id]={st:stageStates(r),ts:r.ts,items:r.items||[],po:r.production_order||'',by:r.inspector||''}});
  }
  if(tk!==loadTk)return false; // มีการเลือกช่วงใหม่ระหว่างโหลด — ทิ้งผลเก่า
  status=st;skipsBy=skp;errs=er;rangeBad=bad;return true;
}
const hhmm=ts=>ts?new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.':'';
const fmt=v=>v==null||v===''||!isFinite(+v)?'—':String(Number((+v).toFixed(4)));
const hm=t=>t?new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';
function pcell(it,pc){
  const has=pc&&(pc.status||pc.value!=null);
  if(!has)return '<td class="pc none">–</td>';
  const st=pc.status||'ok';
  if(it.type==='numeric')return '<td class="pc '+(st==='ng'?'ng':'ok')+'">'+esc(pc.value!=null?pc.value:'–')+(st==='ng'?' ✖':'')+'</td>';
  return '<td class="pc '+st+'">'+({ok:'✔',ng:'✖',fixed:'🔧'}[st]||'–')+'</td>';
}
function itemResult(it){
  const ps=(it.pieces||[]).slice(0,3),done=ps.filter(x=>x&&x.status).length,n=Math.max(ps.length,3);
  if(ps.some(x=>x&&x.status==='ng'))return '<span class="pill ng">NG</span>';
  if(!done)return '<span class="pill">ยังไม่ตรวจ</span>';
  if(done<n)return '<span class="pill partial">ไม่ครบ</span>';
  return '<span class="pill ok">ผ่าน</span>';
}
function specText(it){
  if(it.type!=='numeric')return 'ปกติ / ไม่ปกติ';
  const a=it.min!=null,b=it.max!=null;
  return (a&&b?fmt(it.min)+' – '+fmt(it.max):a?'≥ '+fmt(it.min):b?'≤ '+fmt(it.max):'—')+(it.unit?' '+esc(it.unit):'');
}
// รายละเอียดจุดตรวจของ Part (ชุดล่าสุดของวัน): ค่า/ผลของ S M E ต่อจุด — ค่าเริ่มต้น "ยุบ"
function detail(p,date,r){
  if(!r||!r.items||!r.items.length)return '';
  const key=date+'|'+p.id,hide=!opened.has(key),n=r.items.length,ng=r.items.filter(i=>(i.pieces||[]).some(x=>x&&x.status==='ng')).length;
  let h='<div class="chk"><button type="button" class="tg'+(ng?' hasng':'')+'" data-k="'+esc(key)+'">'+(hide?'▸':'▾')+' จุดตรวจ '+n+' จุด'+(ng?' · NG '+ng:'')+'</button>';
  if(!hide){
    const first=(r.items[0].pieces||[]);
    h+='<div class="stg">'+STAGES.map((l,i)=>l+' '+(first[i]&&first[i].at?hm(first[i].at)+(first[i].by?' ('+esc(first[i].by)+')':''):'ยังไม่ตรวจ')).join(' · ')+'</div>';
    h+='<div class="tw"><table class="ct"><thead><tr><th>#</th><th class="l">จุดตรวจ</th><th>เกณฑ์</th>'+STAGES.map(l=>'<th>'+l+'</th>').join('')+'<th>ผล</th></tr></thead><tbody>'
      +r.items.map((it,ix)=>'<tr><td class="no">'+(ix+1)+'</td><td class="l">'+esc(it.label)+(it.sub?'<span class="sp"> · '+esc(it.sub)+'</span>':'')+(it.note?'<span class="nt">หมายเหตุ: '+esc(it.note)+'</span>':'')+'</td><td class="sp">'+specText(it)+'</td>'
        +STAGES.map((l,i)=>pcell(it,(it.pieces||[])[i])).join('')+'<td>'+itemResult(it)+'</td></tr>').join('')
      +'</tbody></table></div>';
  }
  return h+'</div>';
}
$('body').addEventListener('click',e=>{const b=e.target.closest('.tg');if(!b)return;const k=b.dataset.k;opened.has(k)?opened.delete(k):opened.add(k);render()});
function rowHTML(p,date,r){
  const sc=r.st.includes('ng')?'s-ng':r.st.every(x=>x==='ok')?'s-ok':r.st.every(x=>x==='none')?'s-none':'s-partial';
  return '<div class="row '+sc+'"><span class="rst" aria-hidden="true">'+({'s-ok':'✓','s-ng':'!','s-partial':'◐','s-none':'–'}[sc])+'</span><div class="nm">'+esc(p.name)+'<small class="pn">Part No.: '+esc(p.id)+'</small>'+(r.ts?'<small>ตรวจล่าสุด '+hhmm(r.ts)+(r.po?' · Production Order: '+esc(r.po):'')+(r.by?' · ผู้ตรวจ: '+esc(r.by):'')+'</small>':'')+'</div><div class="pills">'+STAGES.map((l,i)=>'<span class="pill '+r.st[i]+'">'+l+' · '+T[r.st[i]]+'</span>').join('')+'</div></div>'+detail(p,date,r);
}
function dayHTML(date,fp,multi){
  const sk=skipsBy[date]||new Set(),stm=status[date]||{};
  const act=fp.filter(p=>!sk.has(p.id)),skp=fp.filter(p=>sk.has(p.id));
  const none={st:['none','none','none']};
  let h=multi?'<div class="dayh">📅 วันที่ '+date+'</div>':'';
  if(!act.length){
    h+='<div class="card"><div class="sum"><div class="sbox off"><b>—</b><span>ไม่ผลิต</span></div></div></div>';
  }else{
    const rows=act.map(p=>(stm[p.id]||none).st);
    const s=STAGES.map((_,i)=>aggStage(rows.map(r=>r[i])));
    const whole=$('f-dept').value&&!$('f-model').value&&!$('f-part').value.trim();
    const cat=r=>r.includes('ng')?'ng':r.every(x=>x==='ok')?'ok':r.every(x=>x==='none')?'none':'partial';
    const cnt={ok:0,partial:0,none:0,ng:0};rows.forEach(r=>cnt[cat(r)]++);
    const tot=act.length*3,dn=rows.reduce((n,r)=>n+r.filter(x=>x==='ok').length,0),pct=tot?Math.round(dn*100/tot):0,rc=cnt.ng?'ng':pct===100?'ok':'go';
    const kp=(k,l)=>'<span class="kp '+k+(cnt[k]?'':' z')+'"><b>'+cnt[k]+'</b>'+l+'</span>';
    h+='<div class="card hero"><div class="hero-top"><div class="ring '+rc+'" style="--p:'+pct+'" role="img" aria-label="ผ่านแล้ว '+pct+' เปอร์เซ็นต์"><b>'+pct+'<small>%</small></b><span>ผ่านแล้ว</span></div><div class="hero-info"><h2>'+(whole?'สรุปทั้ง Line':'สรุปตามตัวกรอง')+' ('+act.length+'/'+fp.length+' Part ที่ผลิต'+(multi?'':'วันนี้')+')</h2><div class="kpis">'+kp('ok','ผ่านครบ')+kp('partial','ตรวจไม่ครบ')+kp('none','ยังไม่ตรวจ')+kp('ng','NG')+'</div></div></div><div class="sum">'+STAGES.map((l,i)=>'<div class="sbox '+s[i]+'"><b>'+l+'</b><div class="st"><span>'+T[s[i]]+'</span><em>'+rows.filter(r=>r[i]==='ok').length+'/'+act.length+' Part ผ่าน</em></div><div class="seg">'+rows.map((r,k)=>'<i class="'+r[i]+'" title="'+esc(act[k].name)+'"></i>').join('')+'</div></div>').join('')+'</div></div>';
    const byDept={};act.forEach(p=>{const d=(byDept[p.dept]=byDept[p.dept]||{});(d[p.model]=d[p.model]||[]).push(p)});
    const multiLine=Object.keys(byDept).length>1;
    h+='<div class="card"><h2>รายละเอียดราย Part</h2>'+Object.entries(byDept).map(([di,bm])=>
      (multiLine?'<div class="lnh">Line: '+esc(deptMap[di].name)+(deptMap[di].section?' <small>· แผนก '+esc(deptMap[di].section)+'</small>':'')+'</div>':'')
      +Object.entries(bm).map(([m,a])=>'<div class="model">Model: '+esc(m)+'</div>'+a.map(p=>rowHTML(p,date,stm[p.id]||none)).join('')).join('')
    ).join('')+'</div>';
  }
  if(skp.length)h+='<div class="card skip">⏸ ไม่ผลิต'+(multi?'':'วันนี้')+' (ไม่นำมาคิด '+skp.length+' Part): '+skp.map(p=>esc(p.name)).join(' · ')+'</div>';
  return h;
}
function render(){
  $('warn').innerHTML=mErrs.concat(errs).map(e=>'<div class="warn">'+esc(e)+'</div>').join('');
  const from=$('f-from').value,to=$('f-to').value,sd=$('f-dept').value,sec=$('f-sec').value;
  $('ttl').textContent=sd?'Line: '+deptMap[sd].name:'Line: ทั้งหมด';
  $('live').hidden=!(to>=today());
  $('sub').textContent='แผนก: '+(sd?(deptMap[sd].section||'-'):(sec||'ทั้งหมด'))+' · '+(from===to?'วันที่ '+from:'วันที่ '+from+' ถึง '+to);
  if(rangeBad){$('body').innerHTML='<div class="empty">กรุณาเลือกช่วงวันที่ให้ถูกต้อง (ไม่เกิน '+MAXD+' วัน)</div>';return}
  if(!deptList.length){$('body').innerHTML='<div class="empty">ไม่พบข้อมูล Line</div>';return}
  const fp=filtered();
  if(!fp.length){$('body').innerHTML='<div class="empty">ไม่พบ Part ตามตัวกรองที่เลือก</div>';return}
  const last=to<today()?to:today(),multi=from!==to;
  let h='',hidden=0;
  for(let d=last;d>=from;d=addDay(d,-1)){
    // หลายวัน: แสดงเฉพาะวันที่มีการตรวจ เพื่อไม่ให้ยาวเกินไป
    if(multi&&!fp.some(p=>(status[d]||{})[p.id])){hidden++;continue}
    h+=dayHTML(d,fp,multi);
  }
  if(multi){
    if(!h)h='<div class="empty">ไม่มีข้อมูลการตรวจในช่วงวันที่นี้</div>';
    else if(hidden)h+='<div class="skip">ไม่มีข้อมูลการตรวจ '+hidden+' วัน (ไม่แสดง)</div>';
  }else if(!h)h='<div class="empty">ยังไม่ถึงวันที่เลือก</div>';
  $('body').innerHTML=h;
}
async function refresh(silent){
  if(!silent){$('body').innerHTML=SK;$('body').classList.add('fresh')}
  const rb=$('btn-refresh');rb.classList.add('busy');
  let ok;try{ok=await loadStatus()}finally{rb.classList.remove('busy')}
  if(ok){render();$('back').href='layout.html?date='+$('f-from').value}
  setTimeout(()=>$('body').classList.remove('fresh'),1200);
}
// เปิดมาจากแท็บ Layout → ปิดแท็บนี้เพื่อกลับ · ถ้าปิดไม่ได้ (เช่น เปิดลิงก์ตรง) ค่อยไปหน้า Layout
$('back').onclick=e=>{e.preventDefault();window.close();setTimeout(()=>{location.href=$('back').href},200)};
// --- ตัวกรองวันที่ (เปลี่ยนแล้วโหลดใหม่) ---
const setRange=(a,b)=>{$('f-from').value=a;$('f-to').value=b};
$('f-from').onchange=()=>{if(!$('f-from').value)return;if($('f-to').value<$('f-from').value)$('f-to').value=$('f-from').value;$('f-month').value='';refresh()};
$('f-to').onchange=()=>{if(!$('f-to').value)return;if($('f-from').value>$('f-to').value)$('f-from').value=$('f-to').value;$('f-month').value='';refresh()};
$('f-month').onchange=()=>{
  const v=$('f-month').value;if(!v)return;
  const [y,m]=v.split('-').map(Number),end=v+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
  setRange(v+'-01',end>today()?today():end);refresh();
};
$('btn-today').onclick=()=>{setRange(today(),today());$('f-month').value='';refresh()};
$('btn-reset').onclick=()=>{setRange(today(),today());$('f-month').value='';applyInitFilters();refresh()};
$('btn-refresh').onclick=()=>refresh(true);
// ยุบ/ขยายส่วนหัว (จำค่าที่เลือกไว้ในเบราว์เซอร์นี้)
const hd=document.querySelector('header');
function setHd(min){hd.classList.toggle('hd-min',min);const b=$('btn-hd');b.setAttribute('aria-expanded',String(!min));b.title=min?'ขยายส่วนหัว':'ยุบส่วนหัว';try{localStorage.setItem('line_hd_min',min?'1':'0')}catch(e){}}
$('btn-hd').onclick=()=>setHd(!hd.classList.contains('hd-min'));
try{if(localStorage.getItem('line_hd_min')==='1')setHd(true)}catch(e){}
// --- ตัวกรองแผนก/Line/Model/Part (กรองจากข้อมูลที่โหลดแล้ว ไม่ต้องโหลดใหม่) ---
$('f-sec').onchange=()=>{refreshOpts();render()};
$('f-dept').onchange=()=>{refreshOpts();render()};
$('f-model').onchange=render;
$('f-part').oninput=render;
// เข้าหน้านี้ = วันที่ปัจจุบันเสมอ (ไม่รับ ?date= จากลิงก์)
setRange(today(),today());$('f-from').max=$('f-to').max=today();
setInterval(()=>{if($('f-to').value>=today())refresh(true)},60000); // รีเฟรชอัตโนมัติเฉพาะเมื่อช่วงที่ดูรวมวันนี้
(async()=>{await loadMaster();initFilters();await refresh()})();
// 🎨 ใช้ธีมเดียวกับแอปหลัก/หน้า Layout: fc_theme (สว่าง/มืด) + fc_palette (ชุดสี) + ค่ากลางจาก app_settings
(function(){const root=document.documentElement;
  const setPal=id=>{if(!id||id==='default')root.removeAttribute('data-palette');else if(/^[a-z]+$/.test(id))root.setAttribute('data-palette',id)};
  $('btn-mode').onclick=()=>{const n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('fc_theme',n)}catch(e){}};
  addEventListener('storage',e=>{if(e.key==='fc_theme'&&e.newValue)root.setAttribute('data-theme',e.newValue);if(e.key==='fc_palette')setPal(e.newValue)});
  sb.from('app_settings').select('value').eq('key','theme_palette').limit(1).then(({data})=>{const v=data&&data[0]&&data[0].value;if(v){setPal(v);try{localStorage.setItem('fc_palette',v)}catch(e){}}},()=>{});
})();
// ── นาฬิกา วันที่-เวลา (เดินทุกวินาที) — รูปแบบเดียวกับ Dashboard หลัก ──
function lscStart(){
  const clocks=[...document.querySelectorAll('.lsc-clock')].map(el=>({d:el.querySelector('.lsc-day'),dt:el.querySelector('.lsc-date'),hm:el.querySelector('.lsc-hm'),ss:el.querySelector('.lsc-ss'),sky:el.querySelector('.lsc-sky'),last:''}));
  if(!clocks.length)return;
  const p2=n=>String(n).padStart(2,'0');
  function tick(){
    const n=new Date(),h=n.getHours();
    const day=n.toLocaleDateString('th-TH',{weekday:'long'});
    const date=n.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
    const sky=h<5?['🌙','ดึก',1]:h<12?['🌤️','เช้า',0]:h<17?['☀️','บ่าย',0]:h<19?['🌇','เย็น',0]:['🌙','ค่ำ',1];
    clocks.forEach(c=>{
      c.d.textContent=day;c.dt.textContent=date;
      c.hm.innerHTML=p2(h)+'<i class="lsc-colon">:</i>'+p2(n.getMinutes());
      c.ss.textContent=p2(n.getSeconds());c.ss.classList.remove('lsc-ss-tick');void c.ss.offsetWidth;c.ss.classList.add('lsc-ss-tick');
      if(sky[0]+sky[1]!==c.last){c.last=sky[0]+sky[1];c.sky.textContent=sky[0];c.sky.title='ช่วง'+sky[1];c.sky.classList.toggle('night',!!sky[2]);}
    });
  }
  tick();setInterval(tick,1000);
}
lscStart();
