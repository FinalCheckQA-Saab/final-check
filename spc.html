<title>SPC | Daily Quality Inspection</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">

<style>
:root{
  --navy:#16324f;--gold:#c9a24a;
  --bg:#f3f4f6;--card:#fff;--ink:#1f2937;--muted:#6b7280;--grid:#e5e7eb;--border:#e5e7eb;
  --series:#2f6fd1;--piece:#9aa7b8;--cl:#475569;--limit:#64748b;--spec:#b45309;--bad:#dc2626;--good:#16a34a;
  --bad-bg:#fee2e2;--good-bg:#dcfce7;--warn-bg:#fef3c7;--warn:#92400e;
}
:root[data-theme="dark"]{
  --bg:#0f1624;--card:#161f31;--ink:#e6edf6;--muted:#93a3b8;--grid:#263248;--border:#263248;
  --series:#6c9be2;--piece:#6b7a90;--cl:#b6c4d4;--limit:#94a3b8;--spec:#fbbf24;--bad:#f87171;--good:#4ade80;
  --bad-bg:rgba(248,113,113,.14);--good-bg:rgba(74,222,128,.12);--warn-bg:rgba(251,191,36,.12);--warn:#fcd34d;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0f2137,var(--navy));color:#fff;padding:12px 18px;border-bottom:3px solid var(--gold);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header small{color:#cbd5e1;display:block;font-size:12px}
a.back{color:#fff;font-size:13px;text-decoration:none;opacity:.9}
/* ── ปุ่มหัวหน้า (ธีม / รีเฟรช): pill กระจกฝ้า + ไอคอน SVG เส้นคม + ไฮไลต์สีทอง ── */
.hactions{display:flex;gap:10px;align-items:center}
.hbtn{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:13px;font-weight:600;letter-spacing:.2px;line-height:1;
  padding:6px 16px 6px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#fff;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 10px rgba(0,0,0,.28);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
.hbtn .ico{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:#ecc972;background:radial-gradient(circle at 30% 25%,rgba(236,201,114,.34),rgba(236,201,114,.1));
  box-shadow:inset 0 0 0 1px rgba(236,201,114,.35);transition:background .2s ease,color .2s ease,box-shadow .2s ease}
.hbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hbtn:hover{transform:translateY(-1px);border-color:rgba(236,201,114,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.34),0 0 0 3px rgba(201,162,74,.18)}
.hbtn:hover .ico{background:linear-gradient(135deg,#f0d283,var(--gold));color:#0f2137;box-shadow:0 0 12px rgba(236,201,114,.55)}
.hbtn:active{transform:translateY(0) scale(.96)}
.hbtn:focus-visible{outline:2px solid #ecc972;outline-offset:3px}
/* ธีม: ดวงอาทิตย์ ⇄ พระจันทร์ หมุนสลับตามโหมดปัจจุบัน */
.hbtn .ico-sun,.hbtn .ico-moon{position:absolute;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
:root[data-theme="light"] .hbtn .ico-moon{opacity:0;transform:rotate(-100deg) scale(.3)}
:root[data-theme="dark"] .hbtn .ico-sun{opacity:0;transform:rotate(100deg) scale(.3)}
:root[data-theme="light"] #btn-theme:hover .ico-sun{transform:rotate(45deg) scale(1.08)}
:root[data-theme="dark"] #btn-theme:hover .ico-moon{transform:rotate(-14deg) scale(1.08)}
/* รีเฟรช: หมุนเมื่อ hover และหมุนต่อเนื่องระหว่างโหลดข้อมูล */
.hbtn .ico-refresh{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
#btn-refresh:hover .ico-refresh{transform:rotate(180deg)}
#btn-refresh.spin{pointer-events:none;border-color:rgba(236,201,114,.75)}
#btn-refresh.spin .ico-refresh{animation:hspin .85s linear infinite}
@keyframes hspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hbtn,.hbtn *{transition:none!important}#btn-refresh.spin .ico-refresh{animation-duration:2s}}
@media (max-width:480px){.hbtn{padding-right:12px}}
/* ── ส่วนหัวย่อ/ขยายได้ (ค่าเริ่มต้น = ย่อ) ── */
header{transition:padding .28s ease}
header.collapsed{padding-top:7px;padding-bottom:7px}
.hd-top{display:block}
header.collapsed .hd-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.collapsed .hd-top h1{font-size:17px;line-height:1.25}
header.collapsed a.back{padding:3px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);font-size:12px;opacity:1;white-space:nowrap}
header.collapsed a.back:hover{border-color:rgba(236,201,114,.7)}
.hd-more{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .3s ease,opacity .25s ease}
.hd-more-in{overflow:hidden;min-height:0}
header.collapsed .hd-more{grid-template-rows:0fr;opacity:0;pointer-events:none}
header.collapsed .hd-more small{visibility:hidden}
.hbtn-icon .ico-chev{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
#hdr:not(.collapsed) .hbtn-icon .ico-chev{transform:rotate(180deg)}
header.collapsed .hbtn{padding:4px 13px 4px 4px;font-size:12px}
header.collapsed .hbtn .ico{width:26px;height:26px}
header.collapsed .hbtn svg{width:15px;height:15px}
header.collapsed .hactions{gap:8px}
@media (max-width:640px){
  .hbtn-txt{display:none}.hbtn-icon{padding-right:6px}
  /* มือถือ: ส่วนหัวย่อให้เหลือบรรทัดเดียว — ‹ + ชื่อหน้า + ปุ่มไอคอน */
  header.collapsed{flex-wrap:nowrap;gap:8px;padding-left:12px;padding-right:12px}
  header.collapsed .hd-left{flex:1;min-width:0}
  header.collapsed .hd-top{flex-wrap:nowrap;gap:9px}
  header.collapsed .hd-top h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  header.collapsed .back-txt{display:none}
  header.collapsed a.back{padding:2px 11px;font-size:16px;line-height:1.3}
  header.collapsed .hbtn{padding:4px}
  header.collapsed .hbtn>span:not(.ico){display:none}
  header.collapsed .hactions{gap:6px;flex:none}
}

main{padding:14px 18px 40px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.filters select,.filters input{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);min-width:160px;max-width:100%}
.filters .grow{flex:1;min-width:220px}.filters .grow select{width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--card)}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums}
.tile small{font-size:11px;color:var(--muted)}
.tile.bad{background:var(--bad-bg);border-color:var(--bad)}
.tile.good{background:var(--good-bg);border-color:var(--good)}
h2{font-size:15px;margin:0 0 2px}.sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:10px;overflow:visible}
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;z-index:5;min-width:170px;max-width:260px;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--border);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:12px;line-height:1.5;display:none}
.tip b{font-size:13px}.tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tip .st{margin-top:4px;font-weight:700}
.tip .bad{color:var(--bad)}.tip .ok{color:var(--good)}
.msg{padding:36px 16px;text-align:center;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.tblwrap{overflow:auto;max-height:420px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:12px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
td.bad{color:var(--bad);font-weight:700}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.note code{background:var(--bg);padding:1px 5px;border-radius:4px}

body{min-height:100vh;background:radial-gradient(900px 360px at 88% -60px,var(--accent-dim),transparent 70%),var(--bg)}
header{position:sticky;top:0;z-index:30;border-bottom:0;background:radial-gradient(560px 150px at 92% -30px,color-mix(in srgb,var(--accent) 40%,transparent),transparent 70%),linear-gradient(120deg,var(--brand-navy-900),var(--brand-navy-800) 55%,var(--brand-navy-700));box-shadow:0 8px 24px -10px rgba(0,0,0,.55)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand-gold),transparent 75%)}
.hd-top{display:flex!important;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:700}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#f0d283,var(--brand-gold));color:var(--brand-navy-900);box-shadow:0 4px 12px -2px rgba(0,0,0,.4)}
.logo svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
header.collapsed .logo{width:28px;height:28px;border-radius:9px}
@media (max-width:640px){header.collapsed .logo{display:none}}
main{max-width:1180px;padding:20px 20px 56px}
.card{border-radius:18px;padding:18px 22px;margin-bottom:16px;box-shadow:var(--sh)}
.filters{display:grid;grid-template-columns:minmax(220px,1.3fr) 190px minmax(240px,1.6fr);gap:14px}
.filters .grow{min-width:0}.filters label{font-size:12.5px;gap:7px}

<script>

// ── ธีม: ใช้ค่าเดียวกับแอปหลัก (fc_theme) ──

const thisMonth=()=>{const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,7)};
const nextMonth=m=>{let[y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++}return y+'-'+String(mo).padStart(2,'0')};
const thMonth=m=>new Date(m+'-01T00:00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'});

async function loadMaster(){
  const [l,j]=await Promise.all([sb.from('lines').select('id,name'),sb.from('jigs').select('id,name,line_id')]);
  if(j.error){$('warn').innerHTML='<div class="warn">โหลดรายการ Part ไม่สำเร็จ: '+esc(j.error.message)+'</div>';return}
  const ln={};(l.data||[]).forEach(x=>ln[x.id]=x.name);
  parts=(j.data||[]).map(p=>({id:p.id,name:p.name,model:ln[p.line_id]||'ไม่ระบุ Model'}))
    .sort((a,b)=>a.model.localeCompare(b.model,'th')||a.name.localeCompare(b.name,'th',{numeric:true}));
  const by={};parts.forEach(p=>(by[p.model]=by[p.model]||[]).push(p));
  $('f-part').innerHTML='<option value="">— เลือก Part Number —</option>'+Object.entries(by).map(([m,a])=>'<optgroup label="Model: '+esc(m)+'">'+a.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</optgroup>').join('');
}

async function loadData(){
  const part=$('f-part').value,month=$('f-month').value;
  rows=[];itemsMap=new Map();cur=null;$('warn').innerHTML='';
  if(!part||!month){$('f-item').innerHTML='<option value="">—</option>';$('body').innerHTML='<div class="card msg">เลือก Part Number และเดือน เพื่อดูกราฟ</div>';return}
  $('body').innerHTML='<div class="card msg">กำลังโหลด...</div>';
  const {data,error}=await sb.from('history').select('id,ts,insp_date,shift,production_order,inspector,items')
    .eq('jig_id',part).gte('insp_date',month+'-01').lt('insp_date',nextMonth(month)+'-01').order('ts',{ascending:true}).limit(1000);
  if(error){$('warn').innerHTML='<div class="warn">โหลดข้อมูลไม่สำเร็จ: '+esc(error.message)+'</div>';$('body').innerHTML='';return}
  rows=data||[];
  // จุดตรวจที่ Admin เลือกให้คิด SPC (Admin Panel > จุดตรวจของ Part) — อ่านสดจากตาราง checkpoints
  let cps=await sb.from('checkpoints').select('item_id,type,spc').eq('jig_id',part),spcCol=true;
  if(cps.error){spcCol=false;cps=await sb.from('checkpoints').select('item_id,type').eq('jig_id',part)} // ยังไม่ได้รัน SQL เพิ่มคอลัมน์ spc
  const cpMap=new Map((cps.data||[]).map(c=>[c.item_id,c]));
  const useCfg=!cps.error&&cpMap.size>0;
  if(!spcCol)$('warn').innerHTML='<div class="warn">ยังไม่ได้รัน SQL เพิ่มคอลัมน์ spc — ตอนนี้แสดงทุกหัวข้อตัวเลข (ยังเลือกจุด SPC ไม่ได้)</div>';
  let hidden=0;
  // รวบรวมหัวข้อที่เป็นตัวเลข (key = id + ชื่อหัวข้อ) ของ Part นี้ในเดือนนี้
  rows.forEach(r=>(r.items||[]).forEach((it,ix)=>{
    if(it.type!=='numeric')return;
    if(useCfg){const c=cpMap.get(it.id);if(!c||c.type!=='numeric'||c.spc===false){hidden++;return}} // ไม่ได้เลือกให้คิด SPC
    const k=it.id+'|'+it.label;
    if(!itemsMap.has(k))itemsMap.set(k,{key:k,label:it.label,sub:it.sub||'',unit:it.unit||'',min:it.min,max:it.max,id:it.id});
    const m=itemsMap.get(k);m.no=ix+1;m.min=it.min;m.max=it.max;m.unit=it.unit||m.unit; // ใช้เกณฑ์ล่าสุด
  }));
  hiddenAll=hidden>0;
  const keys=[...itemsMap.keys()].sort((a,b)=>(itemsMap.get(a).no||0)-(itemsMap.get(b).no||0));

  $('f-item').innerHTML=keys.length?keys.map(k=>'<option value="'+esc(k)+'">'+esc(itemLabel(itemsMap.get(k)))+'</option>').join(''):'<option value="">— ไม่มีหัวข้อตัวเลข —</option>';

// ข้อความในรายการเลือก: ชื่อหัวข้อ (หน่วย) · เกณฑ์ min – max
function itemLabel(it){
  const hasMin=it.min!=null,hasMax=it.max!=null;
  const spec=hasMin&&hasMax?fmt(+it.min)+' – '+fmt(+it.max):hasMin?'≥ '+fmt(+it.min):hasMax?'≤ '+fmt(+it.max):'';
  return (it.no?'จุดที่ '+it.no+' · ':'')+it.label+(spec?' · เกณฑ์ '+spec+(it.unit?' '+it.unit:''):(it.unit?' ('+it.unit+')':''));
}

// สร้างกลุ่มย่อย (1 ชุดตรวจ = 1 จุด, ค่า S/M/E = สมาชิกในกลุ่ม) ของหัวข้อที่เลือก
function buildSubgroups(key){
  const raw=[];let skipped=0;
  rows.forEach(r=>{
    const it=(r.items||[]).find(i=>i.type==='numeric'&&(i.id+'|'+i.label)===key);if(!it)return;
    const vals=(it.pieces||[]).map(p=>p&&p.value!=null&&p.value!==''&&isFinite(+p.value)?+p.value:null);
    const got=vals.filter(v=>v!==null);
    if(got.length<2){skipped++;return}
    raw.push({r,vals,got});
  });
  // ใช้ขนาดกลุ่มที่พบบ่อยที่สุด (ปกติ 3 ชิ้น) — ชุดที่ตรวจไม่ครบทุกชิ้นไม่นำมาคิด
  const cnt={};raw.forEach(g=>cnt[g.got.length]=(cnt[g.got.length]||0)+1);
  let n=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||b-a)[0]||3;if(n>5)n=5;
  const sg=raw.filter(g=>g.got.length===n&&K[n]);
  skipped+=raw.length-sg.length;
  sg.forEach(g=>{g.mean=g.got.reduce((a,b)=>a+b,0)/n;g.range=Math.max(...g.got)-Math.min(...g.got);g.t=new Date(g.r.ts)});
  return{sg,n,skipped};
}

function analyse(it,sg,n){
  const k=K[n]||K[3],N=sg.length;
  const out={N,n};
  if(!N)return out;
  out.xbb=sg.reduce((a,g)=>a+g.mean,0)/N;
  out.rbar=sg.reduce((a,g)=>a+g.range,0)/N;
  if(N>=2){
    out.uclX=out.xbb+k.A2*out.rbar;out.lclX=out.xbb-k.A2*out.rbar;
    out.uclR=k.D4*out.rbar;out.lclR=k.D3*out.rbar;
    out.sigma=out.rbar/k.d2;
    if(it.min!=null&&it.max!=null&&out.sigma>0){
      out.cp=(it.max-it.min)/(6*out.sigma);
      out.cpk=Math.min(it.max-out.xbb,out.xbb-it.min)/(3*out.sigma);
    }
  }
  sg.forEach(g=>{
    g.oocX=N>=2&&(g.mean>out.uclX+1e-9||g.mean<out.lclX-1e-9);
    g.oocR=N>=2&&g.range>out.uclR+1e-9;
    g.oos=g.got.some(v=>(it.min!=null&&v<it.min)||(it.max!=null&&v>it.max));
  });
  out.nOoc=sg.filter(g=>g.oocX||g.oocR).length;
  out.nOos=sg.filter(g=>g.oos).length;
  return out;
}

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function niceTicks(lo,hi,cnt){
  const span=(hi-lo)||Math.abs(hi)||1,raw=span/cnt,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  const step=(f<1.5?1:f<3?2:f<7?5:10)*p,t=[];
  for(let v=Math.ceil(lo/step)*step;v<=hi+step*1e-6;v+=step)t.push(+v.toFixed(10));
  return t;
}
function chart(host,o){
  host.innerHTML='';
  const W=Math.max(320,host.clientWidth),sm=W<520,H=sm?280:340,m={l:sm?46:56,r:sm?84:98,t:16,b:36},uid='g'+Math.random().toString(36).slice(2,7);
  const svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':o.title},host);if(o.anim)svg.classList.add('anim');
  const pts=o.sg.map(o.val);let vals=pts.slice();o.lines.forEach(l=>l.v!=null&&vals.push(l.v));

  el('rect',{x:m.l,y:m.t,width:iw,height:ih},el('clipPath',{id:uid+'c'},defs));
  const zone=(v1,v2,f)=>{const y1=Math.max(m.t,Math.min(B,Y(v1))),y2=Math.max(m.t,Math.min(B,Y(v2)));if(y2>y1)el('rect',{x:m.l,y:y1,width:iw,height:y2-y1,fill:f},svg)};

    el('text',{x:W-m.r+13,y:l.y+4,'font-size':11,'font-weight':600,fill:l.p[1]},g).textContent=l.t});

function gauge(v,anim){
  const ok=v!=null,P=(x,r)=>{const t=Math.PI*(1-Math.min(Math.max(x,0),2)/2);return[(100+r*Math.cos(t)).toFixed(1),(108-r*Math.sin(t)).toFixed(1)]};

  const tk=(x,t)=>{const p=P(x,97);return '<text class="gt" x="'+p[0]+'" y="'+(+p[1]+3)+'" text-anchor="middle">'+t+'</text>'};
  return '<svg viewBox="0 0 200 132" role="img" aria-label="Cpk '+(ok?fmt(v):'—')+'">'
   +(ok?seg(0,1,'var(--bad)')+seg(1,1.33,'var(--amber)')+seg(1.33,2,'var(--good)'):seg(0,2,'var(--grid)',' stroke-dasharray="3 6"'))
   +tk(1,'1.0')+tk(1.33,'1.33')+'<text class="gt" x="20" y="126" text-anchor="middle">0</text><text class="gt" x="180" y="126" text-anchor="middle">2+</text>'
   +(ok?'<g class="nd'+(anim?' nd-a':'')+'" style="transform:rotate('+(Math.min(Math.max(v,0),2)*90)+'deg)"><circle cx="20" cy="108" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="3.5"/></g>':'')
   +'<text class="gv" x="100" y="104" text-anchor="middle">'+(ok?fmt(Math.round(v*100)/100):'—')+'</text><text class="gl" x="100" y="124" text-anchor="middle">Cpk</text></svg>'}

function pieceRows(g,u){return STAGES.map((s,i)=>'<div class="r"><span>'+s+'</span><span>'+(g.vals[i]==null?'—':fmt(g.vals[i])+(u?' '+esc(u):''))+'</span></div>').join('')}

$('f-month').onchange=()=>{sync();loadData()};
$('f-item').onchange=()=>{animateNext=true;draw()};
$('btn-refresh').onclick=async()=>{const b=$('btn-refresh');if(b.classList.contains('spin'))return;b.classList.add('spin');const t0=Date.now();
  try{await loadData()}finally{setTimeout(()=>b.classList.remove('spin'),Math.max(0,700-(Date.now()-t0)))}};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(document.querySelector('#c-x'))draw()},150)});
(async()=>{
  $('f-month').value=q.get('month')||thisMonth();
  await loadMaster();
  if(q.get('part')){$('f-part').value=q.get('part')}
  loadData();
})();
</script>
</body>
</html>
